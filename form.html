<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agregar Aviso de Adopción</title>
  <link rel="stylesheet" href="css/form.css">
</head>
<body>

  <h1>🐾 Agregar Aviso de Adopción 🐾</h1>

  <!-- Formulario -->
  <form id="formAdopcion" novalidate> <!-- lo validaremos con nuestro script -->

    <!-- Sección 1: Lugar -->
    <div class="seccion">
      <h2>¿Dónde?</h2>
      <label for="region">Región *</label>
      <select id="region" required>
        <option value="">Seleccione región</option>
      </select>

      <label for="comuna">Comuna *</label>
      <select id="comuna" required>
        <option value="">Seleccione comuna</option>
      </select>

      <label for="sector">Sector</label>
      <input type="text" id="sector" maxlength="100" placeholder="Opcional">
    </div>

    <!-- Sección 2: Contacto -->
    <div class="seccion">
      <h2>¿Contacto de esta publicación?</h2>
      <label for="nombre">Nombre *</label>
      <input type="text" id="nombre" required minlength="3" maxlength="200">

      <label for="email">Email *</label>
      <input type="email" id="email" required maxlength="100">

      <label for="celular">Número de celular</label>
      <input type="tel" id="celular" placeholder="+569.12345678"
             pattern="^\+\d{1,3}\.\d{8,12}$">

      <label for="contactarPor">Contactar por</label>
      <select id="contactarPor">
        <option value="">Ninguno</option>
        <option>WhatsApp</option>
        <option>Telegram</option>
        <option>X</option>
        <option>Instagram</option>
        <option>TikTok</option>
        <option>Otra</option>
      </select>
      <input type="text" id="contactoID" placeholder="ID o URL" minlength="4" maxlength="50" style="display:none;">
    </div>

    <!-- Sección 3: Mascota -->
    <div class="seccion">
      <h2>¿Qué mascota ofrece en adopción?</h2>
      <label for="tipo">Tipo *</label>
      <select id="tipo" required>
        <option value="">Seleccione</option>
        <option>Gato</option>
        <option>Perro</option>
      </select>

      <label for="cantidad">Cantidad *</label>
      <input type="number" id="cantidad" required min="1">

      <label for="edad">Edad *</label>
      <input type="number" id="edad" required min="1">

      <label for="unidadEdad">Unidad *</label>
      <select id="unidadEdad" required>
        <option value="">Seleccione</option>
        <option>Meses</option>
        <option>Años</option>
      </select>

      <label for="fechaEntrega">Fecha disponible para entrega *</label>
      <input type="datetime-local" id="fechaEntrega" required>

      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" cols="50" rows="10"></textarea>

      <div class="fotos">
        <label>Fotos *</label>
        <input type="file" name="fotos" accept="image/*" required>
        <button type="button" id="btnAgregarFoto">Agregar otra foto</button>
      </div>
    </div>

    <button type="submit" class="boton-submit">Agregar este aviso de adopción</button>
  </form>

  <!-- Confirmación -->
  <div id="confirmacion" class="mensaje-confirmacion" style="display:none;">
    <p>¿Está seguro que desea agregar este aviso de adopción?</p>
    <button id="siConfirmo">Sí, estoy seguro</button>
    <button id="noConfirmo">No, no estoy seguro, quiero volver al formulario</button>
  </div>

  <!-- Mensaje final -->
  <div id="mensajeFinal" class="mensaje-final" style="display:none;">
    <p>Hemos recibido la información de adopción, ¡muchas gracias y suerte! 🐶🐱</p>
    <button onclick="window.location.href = 'index.html'">Volver a la portada</button>
  </div>

  <!-- Importamos archivos js: el que contiene las comunas por region y el que maneja 
   el resto de la lógica del form -->
  <script src="js/region_comuna.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
