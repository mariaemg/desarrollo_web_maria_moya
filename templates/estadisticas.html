<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estadísticas de Avisos de Adopción</title>
<!-- Reutilizar CSS de index para algunos elementos -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/stats.css') }}">
</head>
<body>
  <div class="header"><h1>Estadísticas de Avisos de Adopción</h1></div>

  <div class="main">
    <div class="grafico">
      <h2>Cantidad de avisos por día</h2>
      <img src="../static/images/grafico-lineas.jpeg" alt="Gráfico de líneas: cantidad de avisos por día">
    </div>

    <div class="grafico">
      <h2>Total de avisos por tipo de mascota</h2>
      <img src="../static/images/grafico-torta.jpeg" alt="Gráfico de torta: avisos por tipo de mascota">
    </div>

    <div class="grafico">
      <h2>Comparación mensual de adopciones (Gatos vs Perros)</h2>
      <img src="../static/images/grafico-barras.jpeg" alt="Gráfico de barras: comparación mensual de adopciones">
    </div>

    <div style="text-align:center; margin-top:18px;">
      <a class="stats-link" href="{{ url_for('index') }} ">Volver a portada</a>
    </div>
  </div>
</body>
</html>
