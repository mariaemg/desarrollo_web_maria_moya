<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Información Aviso de Adopción</title>
  <!-- Reutilizamos CSS de index -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/info.css">
</head>
<body>
  <div class="header">
    <h1>Información del Aviso</h1>
  </div>

  <div class="detalle">
    <!-- Iremos reemplazando luego la info con lo correspondiente (de acuerdo a la fila seleccionada) -->
    <h2 id="titulo">Título</h2>

    <div class="main">
      <p><strong>Fecha Publicación:</strong> <span id="fecha"></span></p>
      <p><strong>Fecha Entrega:</strong> <span id="entrega"></span></p>
      <p><strong>Comuna:</strong> <span id="comuna"></span></p>
      <p><strong>Sector:</strong> <span id="sector"></span></p>
      <p><strong>Cantidad / Tipo / Edad:</strong> <span id="cantidad"></span> <span id="tipo"></span> / <span id="edad"></span></p>
      <p><strong>Contacto:</strong> <span id="contacto"></span></p>
    </div>

    <h3 style="text-align:center; margin-top:18px;">Fotos (click para ampliar)</h3>
    <div class="fotos-grid" id="fotosGrid"></div>

    <div class="acciones">
      <button onclick="location.href='list.html'">Volver al listado</button>
      <button onclick="location.href='index.html'">Volver a portada</button>
    </div>
  </div>

  <!-- Modal con la foto en grande-->
  <div class="photo-modal" id="photoModal">
    <div class="photo-modal-content">
      <img id="fotoGrande" src="images/placeholder.png" alt="Foto ampliada"> <!-- placeholder inicial en src para evitar error validador html -->
      <button id="cerrarFoto">Cerrar</button>
    </div>
  </div>

  <script>
    const avisos = {
      "1": { titulo:"1 Perro / 1 mes - Wiliberto", fecha:"2025-08-18 12:00", entrega:"2025-08-20", comuna:"Santiago", sector:"Beauchef 850, terraza", cantidad:"1", tipo:"Perro", edad:"1 mes", contacto:"Wiliberto / wili@mail.com", fotos:["images/wiliberto.jpg"] },
      "2": { titulo:"2 Perros / 5 años - Dulce y Milú", fecha:"2025-08-17 19:00", entrega:"2025-08-19", comuna:"San Bernardo", sector:"Plaza de San Bernardo", cantidad:"2", tipo:"Perro", edad:"5 años", contacto:"Dulce y Milú / dulcemilu@mail.com", fotos:["images/dulcemilu.jpg","images/dulce.jpeg","images/milu.jpeg"] },
      "3": { titulo:"1 Gato / 1 año - Gustavo", fecha:"2025-08-17 18:00", entrega:"2025-08-21", comuna:"Santiago", sector:"Parque O'Higgins", cantidad:"1", tipo:"Gato", edad:"1 año", contacto:"Gustavo / gustavo@mail.com", fotos:["images/gustavo.jpg"] },
      "4": { titulo:"1 Perro / 3 años - Enrique", fecha:"2025-08-16 16:30", entrega:"2025-08-18", comuna:"Providencia", sector:"Bustamante", cantidad:"1", tipo:"Perro", edad:"3 años", contacto:"Enrique / perrowaton@mail.com", fotos:["images/perrowaton.jpg"] },
      "5": { titulo:"1 Gato / 3 meses - Miguel", fecha:"2025-08-15 15:00", entrega:"2025-08-17", comuna:"La Florida", sector:"Vicuña Mackenna", cantidad:"1", tipo:"Gato", edad:"3 meses", contacto:"Miguel / miguel@mail.com", fotos:["images/gato.jpg"] }
    };

    // Obtener fila
    function getQueryFila() {
      const params = new URLSearchParams(location.search);
      return params.get("fila") || "0";
    }
    
    // Rellenamos los datos de acuerdo a la fila seleccionada
    function renderAviso(fila) {
      const id = String(Number(fila) + 1);
      const a = avisos[id] || avisos["1"];

      document.getElementById("titulo").textContent = a.titulo;
      document.getElementById("fecha").textContent = a.fecha;
      document.getElementById("entrega").textContent = a.entrega;
      document.getElementById("comuna").textContent = a.comuna;
      document.getElementById("sector").textContent = a.sector;
      document.getElementById("cantidad").textContent = a.cantidad;
      document.getElementById("tipo").textContent = a.tipo;
      document.getElementById("edad").textContent = a.edad;
      document.getElementById("contacto").textContent = a.contacto;

      const fotosGrid = document.getElementById("fotosGrid");
      fotosGrid.innerHTML = ""; // Reseteamos para evitar acumulación indeseada

      a.fotos.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = a.titulo;
        img.addEventListener("click", () => {
          document.getElementById("fotoGrande").src = src;
          document.getElementById("photoModal").style.display = "flex";
        });
        fotosGrid.appendChild(img);
      });
    }

    // Cerrar modal
    document.getElementById("cerrarFoto").addEventListener("click", () => {
      document.getElementById("photoModal").style.display = "none";
    });

    renderAviso(getQueryFila()); // Siempre debemos renderizar el aviso
  </script>
</body>
</html>
