<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluar Avisos de Adopción</title>

    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/evaluaciones.css}">
    <link rel="stylesheet" th:href="@{/css/list.css}">
</head>
<body>
<header class="header">
    <h1>🐾 Evaluar Avisos de Adopción 🐾</h1>
    <p>Califica los avisos y ayuda a mejorar la experiencia</p>
</header>

<main class="main">
    <h2>Listado de Avisos</h2>

    <div class="tabla-wrapper">
        <table class="tabla-adopciones" id="tablaAvisos">
            <thead>
            <tr>
                <th>ID</th>
                <th>Fecha publicación</th>
                <th>Sector</th>
                <th>Cantidad / Tipo / Edad</th>
                <th>Comuna</th>
                <th>Nota promedio</th>
                <th>Evaluar</th>
            </tr>
            </thead>
            <tbody>
            <!-- Se llena con js, igual que en Flask -->
            </tbody>
        </table>
    </div>

    <div id="paginacion" class="paginacion"></div>
    
</main>

<!-- JS -->
<script th:src="@{/js/evaluaciones.js}"></script>

</body>
</html>
